apiVersion: apps/v1
kind: Deployment
metadata:
  name: toro-transmission
  labels:
    app: toro-transmission
spec:
  replicas: 2
  selector:
    matchLabels:
      app: toro-transmission
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: toro-transmission
    spec:
      containers:
        - name: toro-transmission
          image: maxspeed2020/toro-transmission:latest
          imagePullPolicy: IfNotPresent   # Pulls updated image from Docker Hub
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
